        <div class="card-body p-6">
            <form>

                <div class="row align-items-center">
                    <label for="email" class="col-sm-4 col-form-label fw-bold text-start">Email:</label>
                    <div >
                        <input type="email" class="form-control" id="email" placeholder="Nhập vào email">
                    </div>
                </div>

                <div class="mb-12 row align-items-center">
                    <label for="password" class="col-sm-4 col-form-label fw-bold text-start">Mật khẩu:</label>
                    <div class="col-sm-12">
                        <input type="password" class="form-control" id="password" placeholder="Nhập vào mật khẩu">
                    </div>
                </div>

                <div class="my-3 row">
                    <div class="col-sm-8 offset-sm-0">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">
                                Ghi nhớ tôi
                            </label>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-sm-12 offset-sm-0">
                        <button type="submit" class="btn btn-primary px-4"
                            style="background-color: #337ab7; border-color: #2e6da4;">Đăng nhập</button>
                    </div>
                </div>
            </form>
        </div>
