<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="all.min.css">
        <title>Document</title>
</head>

<body class="bg-light p-5">

    <div class="container" style="max-width: 900px;">
        <div class="card border shadow-sm">
        
            <div class="card-header bg-primary text-white fw-bold py-3">
                Biểu mẫu đăng nhập
            </div>

           
            <div class="card-body bg-white p-4">
                <form>
                    <div class="row align-items-center g-3">

                        <!-- Ô nhập Email có icon User -->
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i
                                        class="fa fa-user"> <img src="user.png" style="max-width: 30px" alt="#"></i></span>
                                <input type="email" class="form-control" placeholder="Nhập vào email">
                            </div>
                        </div>

                      
                        <div class="col-md-4">
                            <div class="input-group">
                                <span class="input-group-text bg-light text-secondary"><i
                                        class="fa-solid fa-lock"><img src="lock.png" style="max-width: 30px" alt="#"></i></span>
                                <input type="password" class="form-control" placeholder="Nhập vào mật khẩu">
                            </div>
                        </div>

                      
                        <div class="col-md-4 d-flex align-items-center justify-content-between">
                            <div class="form-check mb-0">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label text-secondary small" for="rememberMe">
                                    Ghi nhớ tôi
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary px-4">Đăng nhập</button>
                        </div>

                    </div>
                </form>
            </div>
        </div>
    </div>

</body>

</html>
