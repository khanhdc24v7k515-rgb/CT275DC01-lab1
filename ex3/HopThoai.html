<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/all.min.css">
        <title>Document</title>
</head>

<body class="p-5">

    <div class="container">
      
        <div class="card p-4 shadow-sm" style="max-width: 450px;">
            <h5 class="mb-3">Mở biểu mẫu đăng nhập</h5>
            <button type="button" class="btn btn-open-modal" data-bs-toggle="modal" data-bs-target="#loginModal " style="max-width: 200px;" >
                Mở hộp thoại
            </button>
        </div>
    </div>

    
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered" style="max-width: 500px;">
            <div class="modal-content">
                
                
                <div class="modal-header pb-0">
                    <h5 class="modal-title w-100 text-center fs-4" id="loginModalLabel">
                        <img src="css/lock.png" alt=""> Đăng nhập
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                
                
                <div class="modal-body px-4 pt-2 pb-3">
                    <form>
                      
                        <div class="mb-3">
                            <label class="form-label fw-bold"><img src="css/user.png" alt="" style="max-width: 25px;"> Người dùng:</label>
                            <input type="text" class="form-control" placeholder="Nhập tên người dùng">
                        </div>

                       
                        <div class="mb-3">
                            <label class="form-label fw-bold"><img src="css/eye.png" alt=""> Mật khẩu:</label>
                            <input type="password" class="form-control" placeholder="Nhập mật khẩu">
                        </div>

                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label text-muted" for="rememberMe">Ghi nhớ tôi</label>
                        </div>

                        
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-login-custom py-2">
                                🔄 Đăng nhập
                            </button>
                        </div>
                    </form>
                </div>

                
                <div class="modal-footer modal-footer-custom justify-content-between align-items-center py-3">
                    <!-- Nút Hủy bỏ -->
                    <button type="button" class="btn btn-cancel-custom btn-sm px-3" data-bs-dismiss="modal">
                        ✖ Hủy bỏ
                    </button>
                    
                    
                    <div class="text-end small">
                        <div>Bạn chưa phải là thành viên? <a href="#" class="text-decoration-none">Đăng ký</a></div>
                        <div>Quên <a href="#" class="text-decoration-none">mật khẩu?</a></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Nhúng Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
